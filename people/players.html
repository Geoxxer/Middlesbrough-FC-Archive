<!DOCTYPE html>
<html>
<title>MFC Archive</title>
<meta name="description" content="An archive of Middlesbrough FC's history.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<link rel="icon" href="/boro_lion.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
<script>
  window.onload = function() {      
    twemoji.parse(document.body, 
      {folder: 'svg', ext: '.svg'}
    );
  }
</script>

<body>
<h1 style="padding-left: 0.5em;">
    <a href="/index.html">
    <img src="/images/players.svg" alt="Middlesbrough FC Archive" style="width:300px;height:auto;">
    </a>
</h1>

<div id="players" class="responsive-gallery"></div>

    <script>
        fetch('/data/players.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('players');

                data.players.forEach(player => {
                    const div = document.createElement('div');
                    div.className = "responsive"; 

                    div.innerHTML = `
                        <div class="gallery">
                            <a href="players/player.html?legacy=${player.legacy_number}">
                                <img src="players/images/${player.legacy_number}.jpg" 
                                    alt="${player.forename} ${player.surname}" 
                                    onerror="this.onerror=null; this.src='players/images/default.jpg';">
                            </a>
                            <div class="desc">
                               ${player.legacy_number} – ${player.forename} ${player.surname}
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
    </script>

<p></p>

</body>

</html>
